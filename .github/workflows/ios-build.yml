name: Build AirTalk iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AirTalk\AirTalk.xcodeproj \
            -scheme AirTalk \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AirTalk-iOS
          path: build/Build/Products/Release-iphoneos/AirTalk.app
